name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfControl-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PerfControl.apk
          gh release create "v1.0.${{ github.run_number }}" PerfControl.apk \
            --title "PerfControl v1.0.${{ github.run_number }}" \
            --notes "ملف التثبيت: PerfControl.apk" --latest

      - name: Run unit tests (does not block the APK)
        if: always()
        continue-on-error: true
        run: gradle :core:test --stacktrace
